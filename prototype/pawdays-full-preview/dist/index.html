<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F7F3ED">
  <meta name="description" content="PawDays 宠物门店平台客户端与店员端全功能交互 H5 预览">
  <title>PawDays 双端预览</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#app-main">跳到主要内容</a>
  <div class="prototype-shell">
    <aside class="prototype-panel" aria-label="原型控制台">
      <div class="brand-lockup">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 22c0-7 5-12 12-12s12 5 12 12c0 10-12 17-12 17S12 32 12 22Z"/><circle cx="19" cy="22" r="2.2"/><circle cx="29" cy="22" r="2.2"/><path d="M20 28c2.2 2 5.8 2 8 0"/></svg>
        <div><strong>PawDays</strong><span>双端交互预览 · GitHub main</span></div>
      </div>
      <div class="panel-block role-panel-block">
        <p class="panel-label">预览端</p>
        <div class="segmented" id="role-switch" role="group" aria-label="切换预览端">
          <button class="is-active" data-role="customer" type="button">客户端</button>
          <button data-role="staff" type="button">店员端</button>
        </div>
      </div>
      <div class="panel-block staff-perspective-block" hidden>
        <p class="panel-label">店员视角</p>
        <div class="segmented" id="perspective-switch" role="group" aria-label="切换店员视角">
          <button class="is-active" data-perspective="owner" type="button">老板</button>
          <button data-perspective="staff" type="button">员工</button>
        </div>
      </div>
      <div class="panel-block">
        <label class="panel-label" for="feature-search">快速找功能</label>
        <div class="search-control compact">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
          <input id="feature-search" type="search" placeholder="如：寄养、优惠券、入库">
          <button id="feature-search-clear" class="icon-button small" type="button" aria-label="清除功能搜索" hidden>×</button>
        </div>
        <div id="feature-search-results" class="feature-results" hidden></div>
      </div>
      <div class="panel-block">
        <p class="panel-label">演示场景</p>
        <div class="scenario-list">
          <button type="button" data-scenario="busy">今日业务</button>
          <button type="button" data-scenario="empty">空状态</button>
          <button type="button" data-scenario="risk">风险提醒</button>
          <button type="button" data-scenario="failure">局部失败</button>
        </div>
      </div>
      <div class="panel-block source-note">
        <span class="status-dot"></span>
        <div><strong>需求基线：随仓库当前提交同步</strong><p>店员端仍处讨论阶段；待决能力会在界面中明确标记。</p></div>
      </div>
      <button class="button outline full" id="reset-demo" type="button">重置演示数据</button>
    </aside>

    <section class="device-stage" aria-label="移动端 H5 预览">
      <div class="device-frame">
        <div class="system-bar" aria-hidden="true"><span>09:41</span><span class="system-icons">● ᯤ ▰</span></div>
        <div id="app-root" class="app-root">
          <header id="app-header" class="app-header"></header>
          <main id="app-main" tabindex="-1"></main>
          <nav id="bottom-nav" class="bottom-nav" aria-label="主要导航"></nav>
          <div id="advisor-slot"></div>
          <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
          <div id="overlay-root"></div>
        </div>
      </div>
      <p class="prototype-caption">原型模拟 · 不代表真实支付、微信广告或后端权限已经接通</p>
    </section>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
