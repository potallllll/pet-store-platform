name: Requirements audit

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/**"
      - "scripts/audit_requirements.py"
      - "prototype/**"
      - ".github/workflows/requirements-audit.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "docs/**"
      - "scripts/audit_requirements.py"
      - "prototype/**"
      - ".github/workflows/requirements-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit requirement consistency
        run: python scripts/audit_requirements.py --root . --output requirements-audit.json
      - name: Check H5 JavaScript syntax
        run: node --check prototype/pawdays-full-preview/dist/app.js
      - name: Verify interactive H5 preview
        run: node prototype/pawdays-full-preview/verify.mjs
