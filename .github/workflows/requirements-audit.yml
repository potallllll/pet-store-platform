name: Requirements audit

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/**"
      - "scripts/audit_requirements.py"
      - ".github/workflows/requirements-audit.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "docs/**"
      - "scripts/audit_requirements.py"
      - ".github/workflows/requirements-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit requirement consistency
        run: python scripts/audit_requirements.py --root . --output requirements-audit.json
